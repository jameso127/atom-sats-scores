seeds:
  - name: seed_subject_to_ks2_test
    description: >
      Maps Atom subject_name to the KS2 test(s) whose conversion curve scores it, with weights.
      Subjects not listed (Science, Verbal Reasoning, Non-Verbal Reasoning, Wellbeing, Screeners)
      are not scored. Rationale in PLAN.md / README.
      Grain: one row per subject_name × ks2_test.
    config:
      column_types:
        subject_name: string
        ks2_test: string
        weight: numeric
        scoring_method: string
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [subject_name, ks2_test]
    columns:
      - name: subject_name
        description: Subject name exactly as in course_hierarchy.subject_name.
        data_tests: [not_null]
      - name: ks2_test
        description: KS2 test whose curve is used.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [gps, reading, maths]
      - name: weight
        description: Weight of this test in the subject's score; weights sum to 1 per subject.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0 and weight <= 1"
      - name: scoring_method
        description: "official (one KS2 test) or official_blended (weighted across tests)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [official, official_blended]
