seeds:
  - name: seed_ks2_scaled_score_conversion
    description: >
      STA KS2 raw score → scaled score conversion tables, one per test year. Generated by
      scripts/build_ks2_conversion_seed.py from GOV.UK; never hand-edit. Raw marks with no official
      scaled score (0–2) have a null scaled_score.
      Grain: one row per test_year × ks2_test × raw_score.
    config:
      column_types:
        test_year: int64
        ks2_test: string
        raw_score: int64
        scaled_score: int64
        max_raw_score: int64
        min_raw_for_scaled_score: int64
        published_date: date
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [test_year, ks2_test, raw_score]
    columns:
      - name: test_year
        description: Year the tests were sat and the table applies to.
        data_tests: [not_null]
      - name: ks2_test
        description: "KS2 test: gps (grammar, punctuation and spelling), reading or maths."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [gps, reading, maths]
      - name: raw_score
        description: Raw mark on the full test (0 to max_raw_score).
        data_tests: [not_null]
      - name: scaled_score
        description: Official scaled score; null where no scaled score is awarded.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 80
                max_value: 120
      - name: max_raw_score
        description: Full marks for the test (gps 70, reading 50, maths 110).
        data_tests: [not_null]
      - name: min_raw_for_scaled_score
        description: Lowest raw mark that earns a scaled score.
        data_tests: [not_null]
      - name: published_date
        description: UK date STA published the table; ks2_table_year(as_at) uses it to pick the year.
        data_tests: [not_null]

  - name: seed_subject_to_ks2_test
    description: >
      Maps Atom subject_name to the KS2 test(s) whose conversion curve scores it, with weights.
      Subjects not listed (Verbal Reasoning, Non-Verbal Reasoning, Wellbeing, Screeners) are not
      scored. Rationale in PLAN.md / README.
      Grain: one row per subject_name × ks2_test.
    config:
      column_types:
        subject_name: string
        ks2_test: string
        weight: numeric
        scoring_method: string
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [subject_name, ks2_test]
    columns:
      - name: subject_name
        description: Subject name exactly as in course_hierarchy.subject_name.
        data_tests: [not_null]
      - name: ks2_test
        description: KS2 test whose curve is used.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [gps, reading, maths]
      - name: weight
        description: Weight of this test in the subject's score; weights sum to 1 per subject.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: false
      - name: scoring_method
        description: "official, official_blended or proxy (proxy rows set is_proxy_score = true)."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [official, official_blended, proxy]
