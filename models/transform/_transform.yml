models:
  - name: trf_pupil_subject_daily
    description: >
      Daily totals of in-scope responses. Grain: one row per pupil × scored subject × year group
      (of the sitting) × day with activity. Incremental: insert_overwrite of the day partitions in
      the lookback window.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pupil_id, subject_name, year_group, answered_date]
    columns:
      - name: year_group
        description: year_group_at_sitting of the sittings the responses came from.
        data_tests: [not_null]
      - name: n_answered
        description: Response rows that day (skips count as answered and wrong).
      - name: n_correct
        description: Correct response rows that day.

  - name: trf_percent_to_scaled_score
    description: >
      Lookup from % correct (whole percent, rounded down) to KS2 scaled score. Grain: one row per
      conversion year × scored subject × percent (0-100). Built from the conversion seeds and
      seed_subject_to_ks2_test (English = half reading, half GPS).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [test_year, subject_name, percent_correct]
