models:
  - name: stg_ks2_scaled_score_conversion
    description: >
      STA KS2 raw score → scaled score conversion tables for every loaded year, combined from the
      per-year seeds in seeds/ks2_scaled_scores/ (generated by scripts/build_ks2_conversion_seed.py;
      never hand-edit). Raw marks with no official scaled score (0–2) have a null scaled_score.
      Grain: one row per test_year × ks2_test × raw_score.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [test_year, ks2_test, raw_score]
    columns:
      - name: test_year
        description: Year the tests were sat; applies to scores in the academic year starting that September.
        data_tests: [not_null]
      - name: ks2_test
        description: "KS2 test: gps (grammar, punctuation and spelling), reading or maths."
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [gps, reading, maths]
      - name: raw_score
        description: Raw mark on the full test (0 to max_raw_score).
        data_tests: [not_null]
      - name: scaled_score
        description: Official scaled score; null where no scaled score is awarded.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 80
                max_value: 120
      - name: max_raw_score
        description: Full marks for the test (gps 70, reading 50, maths 110).
        data_tests: [not_null]
      - name: min_raw_for_scaled_score
        description: Lowest raw mark that earns a scaled score.
        data_tests: [not_null]
      - name: published_date
        description: UK date STA published the table (provenance only).
        data_tests: [not_null]
