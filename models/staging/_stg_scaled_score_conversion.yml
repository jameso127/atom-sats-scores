models:
  - name: stg_scaled_score_conversion
    description: >
      STA raw score → scaled score conversion tables for every loaded key stage and year, combined
      from the per-table seeds in seeds/scaled_scores/. The seeds are written by
      scripts/build_conversion_seed.py, which validates each table before writing (all three
      tests, raw marks 0 to full marks, scores non-decreasing across the scale), so those checks
      aren't repeated as dbt tests; never hand-edit. Raw marks with no official score (0-2) have a
      null scaled_score. Grain: one row per key_stage × test_year × test_name × raw_score.
    data_tests:
      # A duplicate row would double-count in the lookup's weighted average.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [key_stage, test_year, test_name, raw_score]
    columns:
      - name: key_stage
        description: KS1 (scale 85-115) or KS2 (scale 80-120).
      - name: test_year
        description: Year the tests were sat; applies to scores in the academic year starting that September.
      - name: test_name
        description: "gps (grammar, punctuation and spelling), reading or maths."
      - name: raw_score
        description: Raw mark on the full test (0 to max_raw_score).
      - name: scaled_score
        description: Official scaled score; null where no scaled score is awarded.
      - name: max_raw_score
        description: "Full marks: KS1 gps 40, reading 40, maths 60; KS2 gps 70, reading 50, maths 110."
      - name: min_raw_for_scaled_score
        description: Lowest raw mark that earns a scaled score (provenance).
      - name: min_scaled_score
        description: Bottom of the scale (KS1 85, KS2 80); used for raw marks with no official score.
      - name: published_date
        description: UK date STA published the table (provenance).
