sources:
  - name: de_raw
    description: Mock Atom pupil activity data. Read only; never write here. Key tests run on the staging models.
    database: atom-analytics-candidates
    schema: de_raw
    tables:
      - name: responses
        description: One row per question a pupil answered. Expected to exceed 100m rows.
      - name: assessment_sittings
        description: One row per assessment a pupil sat (session_id = sitting id). Soft-deleted via is_deleted.
      - name: pupils
        description: One row per pupil. Soft-deleted via is_deleted.
      - name: course_hierarchy
        description: >
          One row per question: question → atom → subtopic → topic → subject. Current state only
          (no validity dates).
