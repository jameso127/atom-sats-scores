  </g>
  <g opacity="0">
    <rect x="608" y="24" width="268" height="122" rx="20" fill="#ffffff" stroke="#c2dfff" stroke-width="2" />
    <rect x="608" y="24" width="8" height="122" rx="4" fill="#4fbf5e"/>
    <text x="742" y="92" class="h" font-size="46" font-weight="400" text-anchor="middle" style="fill:#4fbf5e" >399</text>
    <text x="742" y="124" class="t" font-size="17" font-weight="400" text-anchor="middle" style="fill:#5d6c7b" >pupil × subject scores</text>
